apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-app
spec:
  replicas: {{ .Values.odoo_replicaCount }}
  selector:
    matchLabels:
      app: odoo-app
  template:
    metadata:
      labels:
        app: odoo-app
    spec:
      # Pod-level securityContext
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 {{ .Values.odoo.dataDir }} {{ .Values.odoo.addonsPath }}
              chmod -R 755 {{ .Values.odoo.dataDir }} {{ .Values.odoo.addonsPath }}
          volumeMounts:
            - name: web-storage
              mountPath: {{ .Values.odoo.dataDir }}
            - name: extra-addons
              mountPath: {{ .Values.odoo.addonsPath }}
      containers:
        - name: odoo
          image: {{ .Values.odoo.image }}
          ports:
            - containerPort: {{ .Values.odoo.containerPort }}
          env:
            - name: HOST
              value: odoo-db
            - name: USER
              value: {{ .Values.postgres.dbUser }}
            - name: PASSWORD
              value: {{ .Values.postgres.dbPassword }}
          command:
            - bash
            - -c
            - |
              echo "Waiting for PostgreSQL..." &&
              until pg_isready -h odoo-db -p 5432 -U {{ .Values.postgres.dbUser }}; do sleep 2; done &&
              echo "PostgreSQL is ready" &&
              if [ ! -f {{ .Values.odoo.dataDir }}/.initialized ]; then
                echo "Initializing Odoo database..." &&
                odoo -c /etc/odoo.conf -d {{ .Values.postgres.dbName }} --init base --without-demo=all --stop-after-init &&
                touch {{ .Values.odoo.dataDir }}/.initialized;
              fi &&
              echo "Starting Odoo..." &&
              odoo -c /etc/odoo.conf
          volumeMounts:
            - name: web-storage
              mountPath: {{ .Values.odoo.dataDir }}
            - name: extra-addons
              mountPath: {{ .Values.odoo.addonsPath }}
            - name: odoo-config
              mountPath: /etc/odoo.conf
              subPath: odoo.conf
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: web-storage
          persistentVolumeClaim:
            claimName: web-pvc
        - name: extra-addons
          hostPath:
            path: /mnt/odoo_addons
        - name: odoo-config
          configMap:
            name: odoo-config
