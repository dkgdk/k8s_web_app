apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-app
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.odoo_replicaCount }} # it is used to ensure always run that no. of pod in deployment
  {{- end }}   # This is overridden by HPA at runtime
  selector:
    matchLabels:
      app: odoo-app
  template:
    metadata:
      labels:
        app: odoo-app
    spec:
      containers:
        - name: odoo
          image: {{ .Values.odoo.image }}
          resources:
            requests:
              cpu: "500m"
          ports:
            - containerPort: {{ .Values.odoo.containerPort }}

          env:
            - name: HOST
              value: odoo-db
            - name: USER
              value: {{ .Values.postgres.dbUser }}
            - name: PASSWORD
              value: {{ .Values.postgres.dbPassword }}


          volumeMounts:
            - name: web-storage
              mountPath: {{ .Values.odoo.dataDir }}
            - name: extra-addons
              mountPath: {{ .Values.odoo.addonsPath }}
            - name: odoo-config
              mountPath: /etc/odoo.conf
              subPath: odoo.conf

          command:
            - bash
            - -c
            - |
              echo "Waiting for PostgreSQL..." &&
              until pg_isready -h odoo-db -p 5432 -U {{ .Values.postgres.dbUser }}; do sleep 2; done &&
              echo "PostgreSQL is ready" &&
              if [ ! -f {{ .Values.odoo.dataDir }}/.initialized ]; then
                odoo -c /etc/odoo.conf -d {{ .Values.postgres.dbName }} --init base --stop-after-init &&
                touch {{ .Values.odoo.dataDir }}/.initialized;
              fi
              odoo -c /etc/odoo.conf

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

      volumes:
        - name: web-storage
          persistentVolumeClaim:
            claimName: web-pvc
        - name: extra-addons
          hostPath:
            path: /mnt/odoo_addons
        - name: odoo-config
          configMap:
            name: odoo-config
